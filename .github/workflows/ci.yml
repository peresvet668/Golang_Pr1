name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - name: Create local config
        run: cp config.env.example config.env
      - name: Run fast tests
        run: make test
      - name: Run concurrent PostgreSQL integration test
        run: make test-integration
      - name: Validate Compose and build the API image
        run: |
          docker compose config --quiet
          docker compose build api
